[package]
name = "hydrus_client"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui"] }
hydrus_core = { path = "../hydrus_core" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10"
