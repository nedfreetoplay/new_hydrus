[package]
name = "hydrus_core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
cfb = "0.15"
chardetng = "0.1.17"
chrono = "0.4"
dirs = "7.0.0"
encoding_rs = "0.8.35"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi"] }
indexmap = "2"
lz4_flex = "0.11"
lzma-rs = "0.3"
md-5 = "0.10"
plist = "1.10"
rand = "0.8"
regex = "1.11"
roxmltree = "0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring", "crypto"] }
time = "0.3"
x509-parser = { version = "0.18", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate", "bzip2", "zstd", "lzma"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
